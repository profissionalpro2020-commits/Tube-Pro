name: Radar de conteudo

# Roda de hora em hora e tambem pode ser disparado na mao pela aba Actions.
# IMPORTANTE: o agendamento (schedule) so funciona a partir do branch padrao do repo.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Coletar e analisar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX_VIDEOS_PER_CHANNEL: "40"
        run: npm run scan

      - name: Salvar os dados atualizados
        run: |
          git config user.name "tube-pro-bot"
          git config user.email "actions@github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualiza dados do radar"
            git push
          fi
