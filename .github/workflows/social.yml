name: Atualizar redes sociais (manual)

# Coleta TikTok/Instagram sob demanda, SEM guardar o token no repositorio.
# Voce cola o token na hora de rodar (aba Actions > este workflow > Run workflow).
# Util pra testar no periodo gratis sem se comprometer.
on:
  workflow_dispatch:
    inputs:
      token:
        description: "Token do EnsembleData (nao fica salvo)"
        required: true

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Coletar (YouTube + redes sociais forcado)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ENSEMBLE_TOKEN: ${{ inputs.token }}
          FORCE_SOCIAL: "1"
          MAX_VIDEOS_PER_CHANNEL: "40"
        run: npm run scan

      - name: Salvar os dados atualizados
        run: |
          git config user.name "tube-pro-bot"
          git config user.email "actions@github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualiza redes sociais (coleta manual)"
            git push
          fi
